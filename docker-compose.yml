version: "3.8"
services:
  auth-db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fleet_identity_db
    ports:
      - "3307:3306"
    volumes:
      - ./database/auth-user/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    
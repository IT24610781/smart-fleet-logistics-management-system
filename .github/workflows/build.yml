name: Smart Fleet CI Pipeline

on:
  push:
    branches:
      - dev
      - main
      - 'feature/*'
  pull_request:
    branches:
      - dev
      - main

jobs:
  build-test:
    name: Build & Test (.NET)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Load Auth test schema into MySQL
        run: |
          sed 's/fleet_identity_db/fleet_identity_db_test/g' database/auth-user/schema.sql > /tmp/auth-schema.test.sql
          mysql -h 127.0.0.1 -P 3306 -u root -ptest_root_password < /tmp/auth-schema.test.sql

      - name: Load Fleet test schema into MySQL
        run: |
          sed 's/fleet_vehicle_db/fleet_vehicle_db_test/g' database/fleet-vehicle/schema.sql > /tmp/fleet-schema.test.sql
          mysql -h 127.0.0.1 -P 3306 -u root -ptest_root_password < /tmp/fleet-schema.test.sql

      - name: Restore
        run: dotnet restore SmartFleet.slnx

      - name: Build
        run: dotnet build SmartFleet.slnx --no-restore

      - name: Test AuthUserService
        env:
          ConnectionStrings__DefaultConnection: "Server=127.0.0.1;Port=3306;Database=fleet_identity_db_test;Uid=root;Pwd=test_root_password;"
        run: dotnet test tests/AuthUserService.Tests --no-build

      - name: Test FleetVehicleService
        env:
          ConnectionStrings__DefaultConnection: "Server=127.0.0.1;Port=3306;Database=fleet_vehicle_db_test;Uid=root;Pwd=test_root_password;"
        run: dotnet test tests/FleetVehicleService.Tests --no-build

      - name: Test remaining projects
        env:
          TEST_TRIP_GUARD_CONNECTION: "Server=127.0.0.1;Port=3306;Uid=root;Pwd=test_root_password;"
        run: |
          dotnet test tests/TrackingTelemetryService.Tests --no-build
          dotnet test tests/TripDispatchService.Tests --no-build

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Lint
        working-directory: frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build release images
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore SmartFleet.slnx
          for spec in 'AuthUserService auth-service' 'FleetVehicleService fleet-service' 'TripDispatchService trip-service' 'TrackingTelemetryService tracking-service'; do
            read -r project image <<< "$spec"
            dotnet publish "services/$project/$project.csproj" -c Release --no-restore -o "release/$image"
            docker build -f scripts/Dockerfile.published --build-arg "SERVICE_DLL=$project.dll" -t "$image:ci" "release/$image"
          done

  deploy-current-azure:
    name: Deploy current Azure apps
    needs: [build-test, frontend-check, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: smartfleet-production
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Publish four API images
        shell: bash
        run: |
          set -euo pipefail
          registry=smartfleetacr-fxgpf2gudpaag4bb.azurecr.io
          az acr login --name smartfleetacr
          dotnet restore SmartFleet.slnx
          for spec in 'AuthUserService auth-service' 'FleetVehicleService fleet-service' 'TripDispatchService trip-service' 'TrackingTelemetryService tracking-service'; do
            read -r project image <<< "$spec"
            dotnet publish "services/$project/$project.csproj" -c Release --no-restore -o "release/$image"
            docker build -f scripts/Dockerfile.published --build-arg "SERVICE_DLL=$project.dll" -t "$registry/$image:$GITHUB_SHA" "release/$image"
            docker push "$registry/$image:$GITHUB_SHA"
          done

      - name: Update Container Apps and verify revisions
        shell: bash
        run: |
          set -euo pipefail
          registry=smartfleetacr-fxgpf2gudpaag4bb.azurecr.io
          for spec in 'smartfleet-auth-demo auth-service' 'smartfleet-fleet-demo fleet-service' 'smartfleet-trip-demo trip-service' 'smartfleet-tracking-demo tracking-service'; do
            read -r app image <<< "$spec"
            previous=$(az containerapp show -n "$app" -g csp-project --query 'properties.template.containers[0].image' -o tsv)
            echo "$app previous image: $previous" >> "$GITHUB_STEP_SUMMARY"
            az containerapp update -n "$app" -g csp-project --image "$registry/$image:$GITHUB_SHA" -o none
            revision=$(az containerapp show -n "$app" -g csp-project --query properties.latestRevisionName -o tsv)
            healthy=false
            for attempt in {1..12}; do
              state=$(az containerapp revision show -n "$app" -g csp-project --revision "$revision" --query properties.runningState -o tsv)
              if [[ "$state" == Running* ]]; then healthy=true; break; fi
              if [[ "$state" == Failed ]]; then break; fi
              sleep 10
            done
            if [[ "$healthy" != true ]]; then echo "$app revision $revision is $state" >&2; exit 1; fi
            echo "$app deployed revision: $revision" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Build and deploy frontend
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          npm run build
          mkdir -p ../release/frontend
          cp -r dist server.cjs package.json ../release/frontend/
          cd ../release/frontend
          zip -qr ../frontend.zip .
          az webapp deploy -g csp-project -n smartfleet-frontend-it24610781 --src-path ../frontend.zip --type zip --only-show-errors

      - name: Smoke test hosted frontend
        run: curl --fail --silent --show-error https://smartfleet-frontend-it24610781.azurewebsites.net/login > /dev/null

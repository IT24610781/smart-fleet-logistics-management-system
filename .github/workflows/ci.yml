name: CI Build

on:
  pull_request:
    branches: [ dev, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore services/AuthUserService/AuthUserService.csproj

      - name: Build
        run: dotnet build services/AuthUserService/AuthUserService.csproj --no-restore
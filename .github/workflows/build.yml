name: Build and Test

on:
  push:
    branches:
      - dev
      - feature/*
  pull_request:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SmartFleet.slnx

      - name: Build
        run: dotnet build SmartFleet.slnx --no-restore

      - name: Test
        run: dotnet test SmartFleet.slnx --no-build
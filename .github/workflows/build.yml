name: Build and Test

on:
  push:
    branches:
      - dev
      - feature/*
  pull_request:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SmartFleet.slnx

      - name: Build
        run: dotnet build SmartFleet.slnx --no-restore

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install --yes mysql-client

      - name: Initialize AuthUserService test database
        run: |
          sed 's/fleet_identity_db/fleet_identity_db_test/g' database/auth-user/schema.sql \
            | mysql --host 127.0.0.1 --port 3306 --user root

      - name: Test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: fleet_identity_db_test
          DB_USER: root
        run: |
          export ConnectionStrings__DefaultConnection="Server=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Uid=${DB_USER};"
          dotnet test SmartFleet.slnx --no-build
name: Smart Fleet CI Pipeline

on:
  push:
    branches:
      - dev
      - main
      - feature/*
  pull_request:
    branches:
      - dev
      - main

jobs:
  build-test:
    name: Build & Test (.NET)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Load Auth test schema into MySQL
        run: |
          sed 's/fleet_identity_db/fleet_identity_db_test/g' database/auth-user/schema.sql > /tmp/auth-schema.test.sql
          mysql -h 127.0.0.1 -P 3306 -u root -ptest_root_password < /tmp/auth-schema.test.sql
      - name: Load Fleet test schema into MySQL
        run: |
          sed 's/fleet_vehicle_db/fleet_vehicle_db_test/g' database/fleet-vehicle/schema.sql > /tmp/fleet-schema.test.sql
          mysql -h 127.0.0.1 -P 3306 -u root -ptest_root_password < /tmp/fleet-schema.test.sql
      - name: Restore
        run: dotnet restore SmartFleet.slnx
      - name: Build
        run: dotnet build SmartFleet.slnx --no-restore
      - name: Test AuthUserService
        env:
          ConnectionStrings__DefaultConnection: "Server=127.0.0.1;Port=3306;Database=fleet_identity_db_test;Uid=root;Pwd=test_root_password;"
        run: dotnet test tests/AuthUserService.Tests --no-build
      - name: Test FleetVehicleService
        env:
          ConnectionStrings__DefaultConnection: "Server=127.0.0.1;Port=3306;Database=fleet_vehicle_db_test;Uid=root;Pwd=test_root_password;"
        run: dotnet test tests/FleetVehicleService.Tests --no-build
      - name: Test remaining projects
        run: |
          dotnet test tests/TrackingTelemetryService.Tests --no-build
          dotnet test tests/TripDispatchService.Tests --no-build

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Lint
        working-directory: frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Build Auth Service Docker Image
        run: docker build -t auth-service:ci ./services/AuthUserService
      - name: Build Fleet Service Docker Image
        run: docker build -t fleet-service:ci ./services/FleetVehicleService

  deploy:
    name: Deploy to Azure (Auth Service)
    needs: [build-test, frontend-check, docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Auth Service
        run: dotnet publish services/AuthUserService -c Release -o ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: smart-fleet-auth-service
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish

  fleet-deploy:
    name: Deploy Fleet Service to Azure
    needs: [build-test, frontend-check, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name smartfleetacr 

      - name: Build Fleet Docker Image
        run: docker build -t smartfleetacr-fxgpf2gudpaag4bb.azurecr.io/fleet-service:${{ github.sha }} ./services/FleetVehicleService

      - name: Push Fleet Docker Image
        run: docker push smartfleetacr-fxgpf2gudpaag4bb.azurecr.io/fleet-service:${{ github.sha }}

      - name: Deploy Fleet Container
        uses: azure/webapps-deploy@v3
        with:
          app-name: smart-fleet-vehicle-container
          images: smartfleetacr-fxgpf2gudpaag4bb.azurecr.io/fleet-service:${{ github.sha }}